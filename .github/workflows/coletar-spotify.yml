name: Coletar Spotify mensal

on:
  schedule:
    # Dia 2 de cada mês, 9h UTC — antes da rotina de relatórios (dia 6)
    - cron: "0 9 2 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm install

      - name: Instalar Chromium (Playwright)
        run: npx playwright install --with-deps chromium

      - name: Coletar ouvintes mensais do Spotify
        run: node scripts/coletar-spotify-todos.js

      - name: Salvar resultado no repositório
        run: |
          git config user.name "robo-relatorios-lebre"
          git config user.email "actions@users.noreply.github.com"
          git add data/spotify-mensal.json
          git diff --staged --quiet && echo "Sem mudanças" || git commit -m "Coleta automática de ouvintes mensais Spotify"
          git push
